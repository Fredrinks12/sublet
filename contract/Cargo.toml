[package]
name = "sublet"
description = "Rent out any Linux machine by the minute. A NEAR contract checks the rent and cuts an SSH key that expires on its own."
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Test builds only. Lets a third party's real payment run through the live MPC network without its
# sender's signature. `about()` reports this flag, and the release build never sets it.
dev-any-payer = []

[dependencies]
near-sdk = { version = "5.30.1", features = ["unstable"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
